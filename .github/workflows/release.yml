name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zips
        run: scripts/build.sh

      - name: Validate manifests
        run: |
          mkdir -p /tmp/m365 && unzip -q dist/adversarial-m365-*.zip -d /tmp/m365
          pipx run check-jsonschema --schemafile https://developer.microsoft.com/json-schemas/teams/v1.29/MicrosoftTeams.schema.json /tmp/m365/manifest.json
          pipx run check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugins/adversarial/plugin.json
          # Agent Plugins 1.0.0 doesn't allow per-server extensions; OpenAI reads its auth from extensions["com.openai"].
          jq 'del(.mcpServers[].extensions)' plugins/adversarial/mcp.json > /tmp/mcp.json
          pipx run check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/mcp.schema.json /tmp/mcp.json
          pipx run check-jsonschema --schemafile https://antigravity.google/schemas/v1/plugin.json plugins/adversarial/.antigravity-plugin/plugin.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version plugins/adversarial/plugin.json)
          # Tags are zero-padded dates (2026.11.04); manifest versions can't have leading zeros.
          expected=$(awk -F. '{printf "%d.%d.%d", $1, $2, $3}' <<<"$GITHUB_REF_NAME")
          if [[ "$expected" != "$version" ]]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match plugin.json version $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
